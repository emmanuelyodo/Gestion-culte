services:
  - type: web
    name: ecclesia-manager
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_EMAIL
        value: pasteur@map-ebenezer.org
      - key: ADMIN_PASSWORD
        sync: false
